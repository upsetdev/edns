name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, test, audit
    runs-on: ubuntu-latest
    # A real Redis, so the Redis-backed store, lock and capture tests run too.
    services:
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    env:
      EDNS_TEST_REDIS_URL: redis://127.0.0.1:6379
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup is preinstalled on the runner; this installs the toolchain
      # pinned in rust-toolchain.toml (with rustfmt and clippy).
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Vulnerability scan
        run: make vuln

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Fly.io
    # Only the canonical repo deploys; forks run checks only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'upsetdev/edns'
    needs: [check, docker]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - name: fly deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
